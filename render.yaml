services:
  - type: web
    name: eporner-leech-bot
    runtime: docker
    plan: free
    region: singapore

    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: API_ID
        sync: false

      - key: API_HASH
        sync: false

      - key: BOT_TOKEN
        sync: false

      - key: ALLOWED_USERS
        sync: false

      - key: MAX_RES
        value: "1080"

      - key: COMPRESS_ABOVE_MB
        value: "500"

      - key: CLEAN
        value: "true"

      - key: DOWNLOAD_DIR
        value: "downloads"

      - key: DATABASE_PATH
        value: "data/database.sqlite3"

      - key: PORT
        value: "8080"

      - key: LOG_LEVEL
        value: "INFO"
